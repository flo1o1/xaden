name: scaffold-ci

on:
  push:
    branches: [main] # REQ-088: the merged commit; branch commits run once, through their pull request
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # later steps run project code; keep the job token out of .git/config
      - name: Install analysis tools (Linux)
        if: runner.os == 'Linux'
        run: |
          . .github/shellcheck.version
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" && sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          pipx install "semgrep==1.180.0"
          pipx install "ruff==0.16.10"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Install analysis tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck semgrep ruff gitleaks # Homebrew versions; Linux job is the pinned reference
      - name: Scaffold checks incl. smoke test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
          SMOKE_REQUIRE_TOOLS: "1"
          SMOKE_VERBOSE: "1" # full assertion log in CI; locally only failures and the total
          STRICT: "1"
        run: scripts/check-scaffold.sh
      # The registry rules are not pinned on purpose: new rules catch new vulnerability patterns,
      # so a finding can appear without a code change (template/docs/security.md).
      - name: SAST with semgrep registry rules (broader, needs network)
        run: semgrep scan --config p/default --metrics=off --error --quiet
      - name: Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: PROJECT_ROOT="$PWD" RULES_FILE="$PWD/template/AGENTS.md" template/scripts/verify-commits.sh --ci
