name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install semgrep
      - name: Static analysis
        run: scripts/check.sh
      - name: Commit messages (contributors may not have local hooks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"   # first push of a branch: check the newest commit
          fi
          scripts/verify-commits.sh "$range"
      - name: Scaffold self-test (only present in the scaffold repository)
        run: if [ -x tests/smoke.sh ]; then tests/smoke.sh; fi
